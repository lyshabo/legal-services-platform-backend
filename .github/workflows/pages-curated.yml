name: Validate curated GitHub Pages artifact

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified artifact after the Pages source is approved
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: curated-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify curated artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate browser JavaScript
        run: |
          node --check app.js
          node --check platform-core.js
          node --check data.js
          node --check i18n.js
          node --check service-evidence.js

      - name: Prepare curated static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          : > _site/.nojekyll
          cp \
            about-tezzeta.jpg \
            app.js \
            data.js \
            i18n.js \
            index.html \
            platform-core.js \
            service-evidence.js \
            styles.css \
            _site/

          expected="$(
            printf '%s\n' \
              .nojekyll \
              about-tezzeta.jpg \
              app.js \
              data.js \
              i18n.js \
              index.html \
              platform-core.js \
              service-evidence.js \
              styles.css |
              LC_ALL=C sort
          )"
          actual="$(find _site -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test -z "$(find _site -type l -print -quit)"

          (
            cd _site
            sha256sum \
              .nojekyll \
              about-tezzeta.jpg \
              app.js \
              data.js \
              i18n.js \
              index.html \
              platform-core.js \
              service-evidence.js \
              styles.css |
              tee SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          final="$(
            find _site -maxdepth 1 -type f -printf '%f\n' |
              LC_ALL=C sort
          )"
          expected_final="$(
            {
              printf '%s\n' "$expected"
              printf '%s\n' SHA256SUMS
            } |
              LC_ALL=C sort
          )"
          test "$final" = "$expected_final"

      - name: Upload verified Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Report verification evidence
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          DEPLOY_REQUESTED: ${{ inputs.deploy }}
          DEPLOY_APPROVED: ${{ vars.ENABLE_CURATED_PAGES_DEPLOYMENT }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          {
            echo "### Curated Pages artifact"
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Curated directory: \`_site\`"
            echo "- Deploy input: \`${DEPLOY_REQUESTED:-false}\`"
            echo "- Deployment gate configured: \`$([[ "$DEPLOY_APPROVED" == "true" ]] && echo yes || echo no)\`"
            echo "- Active Pages source is not changed by this build job."
            echo
            echo "#### SHA-256 manifest"
            echo
            echo '```text'
            cat _site/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy approved curated artifact
    needs: build
    if: ${{ inputs.deploy == true && vars.ENABLE_CURATED_PAGES_DEPLOYMENT == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
