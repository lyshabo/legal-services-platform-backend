services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be supplied through the approved development secret mechanism}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be supplied through the approved development secret mechanism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied through the approved development secret mechanism}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - legal_services_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  legal_services_postgres:
